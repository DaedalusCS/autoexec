echo Made by Daedalus for "CS2: Utility" Courses at "https://www.DaedalusCS.pro"
echo -------------------------------------------------------



//////////////////////////////////////////////////////////
// REQUIRED BINDS ////////////////////////////////////////
//////////////////////////////////////////////////////////

// 01. Temporary hide MapGuides
bind "o" "+mghide";
alias "+mghide" "annotation_clear";
alias "-mghide" "annotation_reload";

// 02. Get your position
bind "i" "getposcopy"

// 03. Position yourself to spawns
bind "LEFTARROW" "spawn_prev";
bind "RIGHTARROW" "spawn_next";
alias "spawn_next" "spawn_first";
alias "spawn_prev" "spawn_last";

// 04. Load utility
bind "UPARROW" "utilitySet_prev";
bind "DOWNARROW" "utilitySet_next";
alias "utilitySet_next" "utilitySet_first";
alias "utilitySet_prev" "utilitySet_last";



//////////////////////////////////////////////////////////
// OPTIONAL BINDS ////////////////////////////////////////
//////////////////////////////////////////////////////////

// Sound Confirmation for Rethrow and Clear Utility
alias "snd_confirm" "play \sounds\ui\panorama\ping_alert_01.vsnd_c";

// 01. Rethrow Last Grenade
bind "[" "sv_rethrow_last_grenade; snd_confirm";

// 02. Clear Utilities & Sound
bind "]" "ent_fire smokegrenade_projectile kill;ent_fire molotov_projectile kill;ent_fire flashbang_projectile kill;ent_fire hegrenade_projectile kill;ent_fire decoy_projectile kill;ent_fire inferno kill; stopsound; snd_confirm";

// 03. Free Move on Map
bind "CAPSLOCK" "noclip";

// 04. Zoom In
bind "ALT" "+smokezoom";
alias "+smokezoom" "fov_cs_debug 20";
alias "-smokezoom" "fov_cs_debug 0";

// 05. Reset Game
bind "END" "mp_team_intro_time 0; cl_versus_intro 0; cl_allow_multi_input_binds 1; bot_kick; mp_limitteams 0; mp_autoteambalance 0; mp_freezetime 0; mp_roundtime 60; mp_roundtime_defuse 60; mp_respawn_on_death_ct 1; mp_respawn_on_death_t 1; mp_warmup_end; mp_restartgame 1";

// 06. Show Impacts
bind "PGUP" "sv_showimpacts 1; sv_grenade_trajectory_prac_pipreview 1";
bind "PGDN" "sv_showimpacts 0; sv_grenade_trajectory_prac_pipreview 0";





////////////////////////////////////////////////////////////
// CONSOLE LOG /////////////////////////////////////////////
////////////////////////////////////////////////////////////
echo --------------- MAP GUIDE BINDS LOADED ----------------

