// Enable MapGuides and settings
exec autoexec_mg_settings
exec spawns/train

// Cycle through Utility Type (Insta Utils/Smokes/Molotovs/HEs/Flashes)
alias "utilitySet_first" "say Train: Istant Utility; annotation_load mg_train_instant; alias utilitySet_next utilitySet_smoke_a; alias utilitySet_prev utilitySet_last"
alias "utilitySet_smoke_a" "say Train: A-Site Smokes; annotation_load mg_train_smoke_a; alias utilitySet_next utilitySet_smoke_b; alias utilitySet_prev utilitySet_first"
alias "utilitySet_smoke_b" "say Train: B-Site Smokes; annotation_load mg_train_smoke_b; alias utilitySet_next utilitySet_smoke_mid; alias utilitySet_prev utilitySet_smoke_a"
alias "utilitySet_smoke_mid" "say Train: Mid Smokes; annotation_load mg_train_smoke_mid; alias utilitySet_next utilitySet_fire; alias utilitySet_prev utilitySet_smoke_b"
alias "utilitySet_fire" "say Train: Molotovs & Incendiaries; annotation_load mg_train_fire; alias utilitySet_next utilitySet_he; alias utilitySet_prev utilitySet_smoke_mid"
alias "utilitySet_he" "say Train: HEs; annotation_load mg_train_he; alias utilitySet_next utilitySet_last; alias utilitySet_prev utilitySet_fire"
alias "utilitySet_last" "say Train: Flashes; annotation_load mg_train_flash; alias utilitySet_next utilitySet_first; alias utilitySet_prev utilitySet_he"