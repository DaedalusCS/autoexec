// Enable MapGuides and settings
exec autoexec_mg_settings
exec spawns/anubis

// Cycle through Utility Type (Insta Utils/Smokes/Molotovs/HEs/Flashes)
alias "utilitySet_first" "say Anubis: Istant Utility; annotation_load mg_anubis_instant; alias utilitySet_next utilitySet_smoke_a; alias utilitySet_prev utilitySet_last"
alias "utilitySet_smoke_a" "say Anubis: A-Site Smokes; annotation_load mg_anubis_smoke_a; alias utilitySet_next utilitySet_smoke_b; alias utilitySet_prev utilitySet_first"
alias "utilitySet_smoke_b" "say Anubis: B-Site Smokes; annotation_load mg_anubis_smoke_b; alias utilitySet_next utilitySet_smoke_mid; alias utilitySet_prev utilitySet_smoke_a"
alias "utilitySet_smoke_mid" "say Anubis: Mid Smokes; annotation_load mg_anubis_smoke_mid; alias utilitySet_next utilitySet_fire; alias utilitySet_prev utilitySet_smoke_b"
alias "utilitySet_fire" "say Anubis: Molotovs & Incendiaries; annotation_load mg_anubis_fire; alias utilitySet_next utilitySet_he; alias utilitySet_prev utilitySet_smoke_mid"
alias "utilitySet_he" "say Anubis: HEs; annotation_load mg_anubis_he; alias utilitySet_next utilitySet_last; alias utilitySet_prev utilitySet_fire"
alias "utilitySet_last" "say Anubis: Flashes; annotation_load mg_anubis_flash; alias utilitySet_next utilitySet_first; alias utilitySet_prev utilitySet_he"