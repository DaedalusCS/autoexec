// Buy up to 5 utilities at any time and anywhere
ammo_grenade_limit_total "6";
mp_maxmoney "60000";
mp_startmoney "60000";
mp_buytime "9999";
mp_buy_anywhere "1";
sv_infinite_ammo "1";

// Utilities & Impacts 
sv_grenade_trajectory_prac_pipreview "1";
sv_grenade_trajectory_prac_trailtime "8";
sv_grenade_trajectory_time_spectator "8";
sv_showimpacts_time "3";

// Buy Utilities
buy incgrenade;
buy molotov;
buy decoy;
buy flashbang;
buy hegrenade;
buy smokegrenade;





