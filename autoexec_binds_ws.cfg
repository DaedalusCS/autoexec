// BUY EQUIPMENT ///////////////////////////////////////////
////////////////////////////////////////////////////////////

// Buy AK-47
bind "F1" "say !ak"

// Buy M4A1-S or M4A4
alias "buyM4A1" "say !m4a1; bind F2 buyM4A4"
alias "buyM4A4" "say !m4a4; bind F2 buyM4A1"
bind "F2" "buyM4A1"

// Buy Galil AR or Famas
alias "buyGalil" "say !galil; bind F3 buyFamas"
alias "buyFamas" "say !famas; bind F3 buyGalil"
bind "F3" "buyGalil"

// Buy AWP
bind "F4" "say !awp"

// Buy Desert Eagle or Tec-9
alias "buyDEagle" "say !deagle; bind F6 buyTec9"
alias "buyTec9" "say !tec9; bind F6 buyDEagle"
bind "F6" "buyDEagle"

// No Primary (Pistol/Knife only)
bind "F7" "say !noprimary"

// Headshots Only
bind "F8" "say !hs"


