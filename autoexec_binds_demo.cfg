// Print Information About Currently Playing Demo ("I", default: "")
bind "I" "demo_info";

// Toggle Demo Playback ("SPACE", default: "")
bind "SPACE" "demo_togglepause";
bind "K" "demo_togglepause";

// Show/Hide Demo Playback UI ("F2", default: "")
bind "F2" "demoui";

// Toggle X-Ray View During Demo Playback ("X", default: "")
bind "X" "toggle spec_show_xray";

// Mark The Current Demo Playback Tick for Later Use ("[", default: "")
bind "[" "demo_marktick";

// Skip The Current Demo Playback to The Marked Tick ("]", default: "")
bind "]" "demo_gotomark";

// Jump Demo Playback 5 Seconds Backward  ("LEFTARROW", default: "")
bind "LEFTARROW" "demo_gototick -320 relative";

// Jump Demo Playback 5 Seconds Forward  ("RIGHTARROW", default: "")
bind "RIGHTARROW" "demo_gototick +320 relative";

// Set Spectator Mode ("MWHEELDOWN", default: "")
bind "MWHEELDOWN" "spec_mode";

// Spectate Previous Player ("UPARROW", default: "")
bind "UPARROW" "spec_prev";

// Spectate Next Player ("DOWNARROW", default: "")
bind "DOWNARROW" "spec_next";

// Set Demo Replay Speed (0.25x - 8x)
bind "J" "demo_dec"
bind "L" "demo_inc"
alias demo_025x "demo_timescale 0.25; alias demo_inc demo_050x; alias demo_dec demo_025x"
alias demo_050x "demo_timescale 0.5;  alias demo_inc demo_1x;   alias demo_dec demo_025x"
alias demo_1x   "demo_timescale 1;    alias demo_inc demo_2x;   alias demo_dec demo_050x"
alias demo_2x   "demo_timescale 2;    alias demo_inc demo_4x;   alias demo_dec demo_1x"
alias demo_4x   "demo_timescale 4;    alias demo_inc demo_8x;   alias demo_dec demo_2x"
alias demo_8x   "demo_timescale 8;    alias demo_inc demo_8x;   alias demo_dec demo_4x"
// Set Demo Default Replay Speed
demo_1x

// Hide HUD and draw only the crosshair and death notices ("F3", default: "")
bind "F3" "toggle cl_draw_only_deathnotices";


// TEST BIND
// Remove or Override Fog Settings During Demo for Clearer Visuals
bind "F4" "toggle fog_enable 0 1; toggle fog_override 1 0";






