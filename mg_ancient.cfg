// Enable MapGuides and settings
exec autoexec_mg_settings
exec spawns/ancient

// Cycle through Utility Type (Insta Utils/Smokes/Molotovs/HEs/Flashes)
alias "utilitySet_first" "say Ancient: Istant Utility; annotation_load mg_ancient_instant; alias utilitySet_next utilitySet_smoke_a; alias utilitySet_prev utilitySet_last"
alias "utilitySet_smoke_a" "say Ancient: A-Site Smokes; annotation_load mg_ancient_smoke_a; alias utilitySet_next utilitySet_smoke_b; alias utilitySet_prev utilitySet_first"
alias "utilitySet_smoke_b" "say Ancient: B-Site Smokes; annotation_load mg_ancient_smoke_b; alias utilitySet_next utilitySet_smoke_mid; alias utilitySet_prev utilitySet_smoke_a"
alias "utilitySet_smoke_mid" "say Ancient: Mid Smokes; annotation_load mg_ancient_smoke_mid; alias utilitySet_next utilitySet_fire; alias utilitySet_prev utilitySet_smoke_b"
alias "utilitySet_fire" "say Ancient: Molotovs & Incendiaries; annotation_load mg_ancient_fire; alias utilitySet_next utilitySet_he; alias utilitySet_prev utilitySet_smoke_mid"
alias "utilitySet_he" "say Ancient: HEs; annotation_load mg_ancient_he; alias utilitySet_next utilitySet_last; alias utilitySet_prev utilitySet_fire"
alias "utilitySet_last" "say Ancient: Flashes; annotation_load mg_ancient_flash; alias utilitySet_next utilitySet_first; alias utilitySet_prev utilitySet_he"