///////////////////////////////
// ---> Communication /////////
///////////////////////////////

// Mute Enemy Team ("Toggle Yes/No")
bind "backspace" "toggle cl_mute_enemy_team 1 0";

// Mute All But Friends ("Toggle Always/No")
bind "f24" "toggle cl_mute_all_but_friends_and_party 2 0";


///////////////////////////////
// ---> Item //////////////////
///////////////////////////////

// Buy Menu Donation Keys ("Left Control")
// cl_buywheel_donate_key "0";


///////////////////////////////
// ---> Crosshair /////////////
///////////////////////////////

// Crosshair Style 
// Alias Defined in Autoexec_Settings file
bind "=" "crosshair_style";

// Crosshair Color
// Alias Defined in Autoexec_Settings file
bind "-" "crosshair_color";


/////////////////////////////////////////////
// KEYBOARD/MOUSE ///////////////////////////
/////////////////////////////////////////////

///////////////////////////////
// ---> Movement Keys /////////
///////////////////////////////

// Move Forward
bind "w" "+forward";

// Move Backward
bind "s" "+back";

// Move Left (strafe)
bind "a" "+left";

// Move Right (strafe)
bind "d" "+right";

// Walk
bind "shift" "+sprint";

// Duck
bind "ctrl" "+duck";

// Jump
// Link Desubtick Jumps
// alias +jump_ "exec desubtick/+jump.cfg";
// alias -jump_ "exec desubtick/-jump.cfg";

// Use Desubtick Jumps on Mouse Wheel
bind "mwheeldown" "+jump";
bind "mwheelup" "+jump";

// Use Default Jump on Spacebar
bind "space" "+jump";


///////////////////////////////
// ---> Weapon Keys ///////////
///////////////////////////////

// Use
bind "e" "+use";

// Fire
bind "MOUSE1" "+attack";

// Secondary Fire
bind "MOUSE2" "+attack2";

// Reload
bind "r" "+reload";

// Pick last weapon
bind "q" "lastinv";

// Drop Weapon
bind "g" "drop";

// Inspect Weapon
bind "f" "+lookatweapon";

// Switch Viewmodel Left/Right Hand
bind "h" "switchhands";

// Buy Menu
bind "b" "buymenu";

// Rebuy
bind "F4" "rebuy";

// Primary weapon
alias "usePrimary" "slot1";
alias "std1" "bind 1 usePrimary";

// Secondary weapon
alias "useSecondary" "slot2";
alias "std2" "bind 2 useSecondary";

// Knife
// alias "+ik" "+lookatweapon"
// alias "-ik" "-lookatweapon"
// alias "+useMelee" "+ik; slot3"; 
// alias "-useMelee" "-ik"; 

alias "useMelee" "slot3"; 
alias "std3" "bind 3 useMelee";

// Grenade Cycle
alias "useGrenade" "slot4"
alias "std4" "bind 4 useGrenade";

// Explosives & Traps
alias "useBomb" "slot5"
alias "std5" "bind 5 useBomb";

// HE Grenade
alias "useHE" "slot6";

alias "std6" "bind 6 useHE";
alias "stdV" "bind V useHE";

// Flashbang
alias "useFlash" "slot7";

alias "std7" "bind 7 useFlash";
alias "stdC" "bind C useFlash";

// Smoke Grenade/Healthshot/Demo X-Ray
alias "useSmoke" "slot8";
alias "useHealthshot" "slot12";
alias "toggleXRay" "toggle spec_show_xray 0 1"
alias "stdXBinds" "useSmoke; useHealthshot; toggleXRay"

alias "std8" "bind 8 useSmoke";
alias "stdX" "bind X stdXBinds";

// Decoy Grenade
alias "useDecoy" "slot9"

alias "std9" "bind 9 useDecoy";

// Molotov / Incendiary
alias "useFire" "slot10";

alias "std0" "bind 0 useFire";
alias "stdZ" "bind Z useFire";



///////////////////////////////
// ---> UI Keys ///////////////
///////////////////////////////

// Scoreboard
bind "TAB" "+showscores";

// Show Team Equipment
// bind "ALT" "toggle cl_teamid_overhead_mode 2 3";

// Toggle Radar Zoom
bind "t" "toggleradarscale";

// Choose Team
bind "m" "teammenu";

// Toggle Console
bind "`" "toggleconsole";


///////////////////////////////
// ---> Communication Options /
///////////////////////////////

// Mouse 4 to Ping Player
bind "MOUSE4" "player_ping";

// Radio Message
bind "F5" "radio";

// Command Raio Message
bind "F6" "radio1";

// Standard Radio Message
bind "F7" "radio2";

// Report Radio Message
bind "F8" "radio3";

// Chat Message
bind "y" "messagemode";

// Team Message
bind "u" "messagemode2";

// Use Microphone
bind "MOUSE5" "+voicerecord";




////////////////////////////////////////////////////////////
// MODIFIER KEY ////////////////////////////////////////////
////////////////////////////////////////////////////////////

bind "MOUSE3" "+modKey";

alias "+modKey" "modZ; modX; modC; modV; mod1; mod2; mod3; mod4; mod5; mod6; mod7; mod8; mod9; mod0";
alias "-modKey" "stdZ; stdX; stdC; stdV; std1; std2; std3; std4; std5; std6; std7; std8; std9; std0";
-modKey




