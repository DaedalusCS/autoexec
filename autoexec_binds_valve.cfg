// Part of "CS2: Utility" Courses at https://www.DaedalusCS.pro
bind "HOME" "exec autoexec_mg_settings";



////////////////////////////////////////////////////////////
// MOUSE PITCH & YAW ///////////////////////////////////////
////////////////////////////////////////////////////////////

// Bind yaw ("X-Axis")
bind "MOUSE_X" "yaw";

// Bind pitch ("Y-Axis")
bind "MOUSE_Y" "pitch";



////////////////////////////////////////////////////////////
// BUY ALIASES /////////////////////////////////////////////
////////////////////////////////////////////////////////////

echo "Create buy binds for console or your autoexec with the CS2 Buy Binds tool: https://DaedalusCS.pro/cs2-toolkit/"

// Vest & Helmet, AK47 or M4A1-S  ("Key 1")
alias "buySet1" "buy vesthelm; buy ak47; buy m4a1_silencer";
alias "mod1" "bind 1 buySet1";

// Vest & Helmet, AK47 or M4A4 ("Key 2")
alias "buySet2" "buy vesthelm; buy ak47; buy m4a1";
alias "mod2" "bind 2 buySet2";

// Vest & Helmet, MP9 or MAC-10  ("Key 3")
alias "buySet3" "buy vesthelm; buy mp9; buy mac10";
alias "mod3" "bind 3 buySet3";

// Vest & Helmet, AWP, Tec-9 or Five-Seven ("Key 4")
alias "buySet4" "buy vesthelm; buy awp; buy tec9; buy fiveseven";
alias "mod4" "bind 4 buySet4";

// Vest & Helmet, SSG 08, Tec-9 or Five-Seven ("Key 5")
alias "buySet5" "buy vesthelm; buy ssg08; buy tec9; buy fiveseven";
alias "mod5" "bind 5 buySet5";

// Desert Eagle ("Key 6")
alias "buySet6" "buy deagle";
alias "mod6" "bind 6 buySet6";

// Buy Zeus-x27 ("Key 7")
alias "buySet7" "buy taser";
alias "mod7" "bind 7 buySet7";

// Buy Defuse Kit ("Key 8")
alias "buySet8" "buy defuser";
alias "mod8" "bind 8 buySet8";

// Buy Vest ("Key 9")
alias "buySet9" "buy vest";
alias "mod9" "bind 9 buySet9";

// Buy Vest & Helmet ("Key 0")
alias "buySet0" "buy vesthelm";
alias "mod0" "bind 0 buySet0";

// Buy HE ("Key V")
alias "buyHE" "buy hegrenade";
alias "modV" "bind V buyHE";

// Buy Flash ("Key C")
alias "buyFlash" "buy flashbang";
alias "modC" "bind C buyFlash";

// Buy Smoke ("Key X")
alias "buySmoke" "buy smokegrenade";
alias "modX" "bind X buySmoke";

// Buy Molotov/Incendiary ("Key Z")
alias "buyFire" "buy molotov; buy incgrenade";
alias "modZ" "bind Z buyFire";

