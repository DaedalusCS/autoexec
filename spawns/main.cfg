alias toggleSpawns "toggleSpawnsOn"
alias toggleSpawnsOn "curMap; alias toggleSpawns toggleSpawnsOff"
alias toggleSpawnsOff "unloadSpawns; alias toggleSpawns toggleSpawnsOn"

alias unloadSpawns "exec_async spawns/unloadSpawns.cfg"
alias curMap "sv_cheats 1; exec_async spawns/offlineCurMap.cfg"
alias loadUnsupportedMap "exec_async spawns/addon/unsupportedMap";

// Maps
alias loadSpawnsMirage "echo "loading Mirage";  exec autoexec_mg_settings.cfg; exec mg_mirage; exec spawns/maps/mirage.cfg"
alias loadSpawnsInferno "echo "loading Mirage";  exec autoexec_mg_settings.cfg; exec mg_inferno; exec spawns/maps/inferno.cfg"
alias loadSpawnsNuke "echo "loading Nuke";  exec autoexec_mg_settings.cfg; exec mg_nuke; exec spawns/maps/nuke.cfg"
alias loadSpawnsAncient "echo "loading Ancient";  exec autoexec_mg_settings.cfg; exec mg_ancient; exec spawns/maps/ancient.cfg"
alias loadSpawnsAnubis "echo "loading Anubis";  exec autoexec_mg_settings.cfg; exec mg_anubis; exec spawns/maps/anubis.cfg"
alias loadSpawnsOverpass "echo "loading Overpass";  exec autoexec_mg_settings.cfg; exec mg_overpass; exec spawns/maps/overpass.cfg"
alias loadSpawnsDust2 "echo "loading Dust2";  exec autoexec_mg_settings.cfg; exec mg_dust2; exec spawns/maps/dust2.cfg"
alias loadSpawnsTrain "echo "loading Train";  exec autoexec_mg_settings.cfg; exec mg_train; exec spawns/maps/train.cfg"
alias loadSpawnsVertigo "echo "loading Vertigo";  exec autoexec_mg_settings.cfg; exec mg_vertigo; exec spawns/maps/vertigo.cfg"





