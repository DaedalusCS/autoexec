// Enable MapGuides and settings
exec autoexec_mg_settings
exec spawns/inferno

// Cycle through Utility Type (Insta Utils/Smokes/Molotovs/HEs/Flashes)
alias "utilitySet_first" "say Inferno: Istant Utility; annotation_load mg_inferno_instant; alias utilitySet_next utilitySet_smoke_a; alias utilitySet_prev utilitySet_last"
alias "utilitySet_smoke_a" "say Inferno: A-Site Smokes; annotation_load mg_inferno_smoke_a; alias utilitySet_next utilitySet_smoke_b; alias utilitySet_prev utilitySet_first"
alias "utilitySet_smoke_b" "say Inferno: B-Site Smokes; annotation_load mg_inferno_smoke_b; alias utilitySet_next utilitySet_smoke_mid; alias utilitySet_prev utilitySet_smoke_a"
alias "utilitySet_smoke_mid" "say Inferno: Mid Smokes; annotation_load mg_inferno_smoke_mid; alias utilitySet_next utilitySet_fire; alias utilitySet_prev utilitySet_smoke_b"
alias "utilitySet_fire" "say Inferno: Molotovs & Incendiaries; annotation_load mg_inferno_fire; alias utilitySet_next utilitySet_he; alias utilitySet_prev utilitySet_smoke_mid"
alias "utilitySet_he" "say Inferno: HEs; annotation_load mg_inferno_he; alias utilitySet_next utilitySet_last; alias utilitySet_prev utilitySet_fire"
alias "utilitySet_last" "say Inferno: Flashes; annotation_load mg_inferno_flash; alias utilitySet_next utilitySet_first; alias utilitySet_prev utilitySet_he"