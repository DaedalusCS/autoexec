// Enable MapGuides and settings
exec autoexec_mg_settings
exec spawns/nuke

// Cycle through Utility Type (Insta Utils/Smokes/Molotovs/HEs/Flashes)
alias "utilitySet_first" "say Nuke: Istant Utility; annotation_load mg_nuke_instant; alias utilitySet_next utilitySet_smoke_a; alias utilitySet_prev utilitySet_last"
alias "utilitySet_smoke_a" "say Nuke: A-Site Smokes; annotation_load mg_nuke_smoke_a; alias utilitySet_next utilitySet_smoke_b; alias utilitySet_prev utilitySet_first"
alias "utilitySet_smoke_b" "say Nuke: B-Site Smokes; annotation_load mg_nuke_smoke_b; alias utilitySet_next utilitySet_smoke_mid; alias utilitySet_prev utilitySet_smoke_a"
alias "utilitySet_smoke_mid" "say Nuke: Mid Smokes; annotation_load mg_nuke_smoke_mid; alias utilitySet_next utilitySet_fire; alias utilitySet_prev utilitySet_smoke_b"
alias "utilitySet_fire" "say Nuke: Molotovs & Incendiaries; annotation_load mg_nuke_fire; alias utilitySet_next utilitySet_he; alias utilitySet_prev utilitySet_smoke_mid"
alias "utilitySet_he" "say Nuke: HEs; annotation_load mg_nuke_he; alias utilitySet_next utilitySet_last; alias utilitySet_prev utilitySet_fire"
alias "utilitySet_last" "say Nuke: Flashes; annotation_load mg_nuke_flash; alias utilitySet_next utilitySet_first; alias utilitySet_prev utilitySet_he"