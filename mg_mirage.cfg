// Enable MapGuides and settings
exec autoexec_mg_settings
exec spawns/mirage

// Cycle through Utility Type (Insta Utils/Smokes/Molotovs/HEs/Flashes)
alias "utilitySet_first" "say Mirage: Istant Utility; annotation_load mg_mirage_instant; alias utilitySet_next utilitySet_smoke_a; alias utilitySet_prev utilitySet_last"
alias "utilitySet_smoke_a" "say Mirage: A-Site Smokes; annotation_load mg_mirage_smoke_a; alias utilitySet_next utilitySet_smoke_b; alias utilitySet_prev utilitySet_first"
alias "utilitySet_smoke_b" "say Mirage: B-Site Smokes; annotation_load mg_mirage_smoke_b; alias utilitySet_next utilitySet_smoke_mid; alias utilitySet_prev utilitySet_smoke_a"
alias "utilitySet_smoke_mid" "say Mirage: Mid Smokes; annotation_load mg_mirage_smoke_mid; alias utilitySet_next utilitySet_fire; alias utilitySet_prev utilitySet_smoke_b"
alias "utilitySet_fire" "say Mirage: Molotovs & Incendiaries; annotation_load mg_mirage_fire; alias utilitySet_next utilitySet_he; alias utilitySet_prev utilitySet_smoke_mid"
alias "utilitySet_he" "say Mirage: HEs; annotation_load mg_mirage_he; alias utilitySet_next utilitySet_last; alias utilitySet_prev utilitySet_fire"
alias "utilitySet_last" "say Mirage: Flashes; annotation_load mg_mirage_flash; alias utilitySet_next utilitySet_first; alias utilitySet_prev utilitySet_he"