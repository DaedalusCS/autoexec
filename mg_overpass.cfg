// Enable MapGuides and settings
exec autoexec_mg_settings
exec spawns/overpass

// Cycle through Utility Type (Insta Utils/Smokes/Molotovs/HEs/Flashes)
alias "utilitySet_first" "say Overpass: Istant Utility; annotation_load mg_overpass_instant; alias utilitySet_next utilitySet_smoke_a; alias utilitySet_prev utilitySet_last"
alias "utilitySet_smoke_a" "say Overpass: A-Site Smokes; annotation_load mg_overpass_smoke_a; alias utilitySet_next utilitySet_smoke_b; alias utilitySet_prev utilitySet_first"
alias "utilitySet_smoke_b" "say Overpass: B-Site Smokes; annotation_load mg_overpass_smoke_b; alias utilitySet_next utilitySet_smoke_mid; alias utilitySet_prev utilitySet_smoke_a"
alias "utilitySet_smoke_mid" "say Overpass: Mid Smokes; annotation_load mg_overpass_smoke_mid; alias utilitySet_next utilitySet_fire; alias utilitySet_prev utilitySet_smoke_b"
alias "utilitySet_fire" "say Overpass: Molotovs & Incendiaries; annotation_load mg_overpass_fire; alias utilitySet_next utilitySet_he; alias utilitySet_prev utilitySet_smoke_mid"
alias "utilitySet_he" "say Overpass: HEs; annotation_load mg_overpass_he; alias utilitySet_next utilitySet_last; alias utilitySet_prev utilitySet_fire"
alias "utilitySet_last" "say Overpass: Flashes; annotation_load mg_overpass_flash; alias utilitySet_next utilitySet_first; alias utilitySet_prev utilitySet_he"